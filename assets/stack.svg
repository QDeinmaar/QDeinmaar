<svg xmlns="http://www.w3.org/2000/svg" width="880" height="178" viewBox="0 0 880 178" role="img" aria-label="stack">

<style>
  text { font-family: ui-monospace, SFMono-Regular, Consolas, 'Liberation Mono', Menlo, monospace; font-size: 14px; fill: #c9d8cc; }
  .dim { fill: #5f8a6b; }
  .g { fill: #39ff88; }
  .a { fill: #ffb454; }
  .b { font-weight: 700; }
  .t { animation: type 1.1s steps(40) backwards; }
  .cur { animation: blink 1s steps(1) infinite; }
  .fade { animation: fade .6s ease-out backwards; }
  .gl1 { animation: gl1 3.2s steps(1) infinite; }
  .gl2 { animation: gl2 3.2s steps(1) infinite; }
  @keyframes type { from { width: 0; } }
  @keyframes blink { 50% { opacity: 0; } }
  @keyframes fade { from { opacity: 0; } }
  @keyframes gl1 { 0%,92%,100% { transform: translate(0,0); }
                    93% { transform: translate(-3px,1px); }
                    96% { transform: translate(3px,-1px); } }
  @keyframes gl2 { 0%,92%,100% { transform: translate(0,0); }
                    94% { transform: translate(3px,-1px); }
                    97% { transform: translate(-3px,1px); } }
</style>

<defs>
  <pattern id="scanst" width="4" height="4" patternUnits="userSpaceOnUse">
    <rect width="4" height="1" fill="#000" opacity="0.18"/>
  </pattern>
  <linearGradient id="barst" x1="0" x2="1">
    <stop offset="0" stop-color="#1f3a26"/><stop offset="1" stop-color="#0d130d"/>
  </linearGradient>
</defs>

<rect x="0.5" y="0.5" width="879" height="177" rx="8" fill="#0a0e0a" stroke="#1f3a26"/>
<path d="M1 8a7 7 0 0 1 7-7h864a7 7 0 0 1 7 7v22H1z" fill="url(#barst)"/>
<circle cx="20" cy="16" r="5" fill="#ff4d6d"/>
<circle cx="38" cy="16" r="5" fill="#ffb454"/>
<circle cx="56" cy="16" r="5" fill="#39ff88"/>
<text x="440.0" y="20" text-anchor="middle" class="dim" style="font-size:12px">stack</text>
<text x="24" y="52" class="g b">$ cat stack.txt</text>
<text x="24" y="80" class="a">langs  </text>
<text x="91.6" y="80">c, c++, python, java, javascript, php, html, css</text>
<text x="24" y="116" class="a">web    </text>
<text x="91.6" y="116">node.js, next.js, laravel, sqlite</text>
<text x="24" y="152" class="a">re/sec </text>
<text x="91.6" y="152">ghidra, gdb, x64dbg, wireshark, burp suite, cyberchef</text>
<rect x="1" y="1" width="878" height="176" rx="8" fill="url(#scanst)" pointer-events="none"/>
</svg>
